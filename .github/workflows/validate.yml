name: Validate agent tools
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  prompts-and-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/agent_tools.py check
      - run: python scripts/agent_tools.py list > catalog.json
