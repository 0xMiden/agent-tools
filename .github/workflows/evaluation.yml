name: Evaluation harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_agent_eval.py -v
      - run: python scripts/agent_eval.py run --suite evaluation/fixtures.json --output evaluation-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-fixtures-python-${{ matrix.python }}
          path: evaluation-results
